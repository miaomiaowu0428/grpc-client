[package]
name = "grpc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.104"
bincode = "1.3.3"
solana-account-decoder-client-types = "4.2.2"
solana-sdk = { version = "4.0.0", default-features = false, features = ["full"] }
solana-transaction-context = "4.2.2"
solana-transaction-error = { version = "3.3.2", features = ["serde"] }
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
tokio = "1.53.1"
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"
# gzip 响应压缩：`CompressionEncoding::Gzip` 这个变体和解压实现都由 tonic 的
# `gzip` feature 控制。yellowstone-grpc-client 只开了 tls-native-roots，所以这里
# 显式开 gzip —— 同 semver 的 feature 会合并到依赖图里那一份 tonic 0.14 上。
# 注意：开 feature 才有 Gzip 变体，千万别删。
tonic = { version = "0.14", default-features = false, features = ["gzip"] }
